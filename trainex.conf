# trainex-sync – nginx-Snippet
# Einbinden im server-Block von tillianbo.com (443/ssl):
#     include /etc/nginx/snippets/trainex.conf;

location ^~ /trainex/ {
    root /var/www;
    autoindex off;
    access_log /var/log/nginx/trainex.access.log;

    # Kalenderdatei: /trainex/<token>.ics (auch als webcal:// abonnierbar)
    location ~ "^/trainex/[A-Za-z0-9_-]{16,}\.ics$" {
        types { }
        default_type "text/calendar; charset=utf-8";
        etag on;
        # Clients dürfen cachen, müssen aber nachfragen -> schnelles 304 per ETag
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Abo-Seite mit „Abonnieren“-Button: /trainex/<token>
    location ~ "^/trainex/([A-Za-z0-9_-]{16,})/?$" {
        types { }
        default_type "text/html; charset=utf-8";
        try_files /trainex/$1.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # alles andere (inkl. direkter .html-Aufruf, Verzeichnislisten): 404
    return 404;
}
